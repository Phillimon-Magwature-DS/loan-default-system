<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2A4A" />
  <title>Reset password - LoanRisk Prediction System</title>
  <link rel="icon" href="/assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <img src="/assets/logo.png" alt="LoanRisk Prediction System" class="brand-logo" />
      <h1>Reset your password</h1>
      <p class="sub">We'll email you a 6-digit code.</p>

      <div id="msg" class="msg"></div>

      <form id="step1" class="step active" novalidate>
        <div class="field">
          <label for="email">Account email</label>
          <input id="email" type="email" required />
        </div>
        <button id="submit1" class="btn" type="submit">Send reset code</button>
      </form>

      <form id="step2" class="step" novalidate>
        <p class="help" style="margin:0 0 12px;">
          If <strong id="targetEmail"></strong> exists, a code was sent. It expires in 10 minutes.
        </p>
        <div class="field">
          <label for="code">Verification code</label>
          <input id="code" inputmode="numeric" pattern="\d{6}" maxlength="6" required />
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" minlength="8" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" type="password" minlength="8" required autocomplete="new-password" />
        </div>
        <button id="submit2" class="btn" type="submit">Reset password</button>
      </form>

      <div class="link-row">
        <a href="/login.html">Back to sign in</a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const msg = document.getElementById('msg');
    const step1 = document.getElementById('step1');
    const step2 = document.getElementById('step2');
    const submit1 = document.getElementById('submit1');
    const submit2 = document.getElementById('submit2');
    let emailValue = '';

    step1.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      emailValue = document.getElementById('email').value.trim();
      if (!emailValue) { showErr(msg, 'Enter your email.'); return; }

      submit1.disabled = true;
      submit1.textContent = 'Sending…';
      const r = await api('/api/auth/forgot-password', { method: 'POST', body: { email: emailValue } });
      submit1.disabled = false;
      submit1.textContent = 'Send reset code';

      if (!r.ok) { showErr(msg, (r.data && r.data.error) || 'Could not send code.'); return; }

      document.getElementById('targetEmail').textContent = emailValue;
      step1.classList.remove('active');
      step2.classList.add('active');
    });

    step2.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      const code = document.getElementById('code').value.trim();
      const newPassword = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirm').value;

      if (!/^\d{6}$/.test(code)) { showErr(msg, 'Enter the 6-digit code.'); return; }
      if (newPassword.length < 8) { showErr(msg, 'Password must be at least 8 characters.'); return; }
      if (newPassword !== confirm) { showErr(msg, 'Passwords do not match.'); return; }

      submit2.disabled = true;
      submit2.textContent = 'Resetting…';
      const r = await api('/api/auth/forgot-password/verify', {
        method: 'POST',
        body: { email: emailValue, code, newPassword },
      });
      submit2.disabled = false;
      submit2.textContent = 'Reset password';

      if (!r.ok) { showErr(msg, (r.data && r.data.error) || 'Reset failed.'); return; }

      showOk(msg, 'Password reset. Redirecting to sign in…');
      setTimeout(() => window.location.replace('/login.html'), 1200);
    });
  </script>
</body>
</html>
