<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B2A4A" />
  <title>Change password - LoanRisk Prediction System</title>
  <link rel="icon" href="/assets/logo.png" type="image/png" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <img src="/assets/logo.png" alt="LoanRisk Prediction System" class="brand-logo" />
      <h1>Change your password</h1>
      <p class="sub" id="hint">Enter your current password and choose a new one.</p>

      <div id="msg" class="msg"></div>

      <form id="form" novalidate>
        <div class="field">
          <label for="oldPassword">Current password</label>
          <input id="oldPassword" type="password" required autocomplete="current-password" />
        </div>
        <div class="field">
          <label for="newPassword">New password</label>
          <input id="newPassword" type="password" minlength="8" required autocomplete="new-password" />
          <div class="help">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="confirm">Confirm new password</label>
          <input id="confirm" type="password" minlength="8" required autocomplete="new-password" />
        </div>
        <button id="submit" class="btn" type="submit">Update password</button>
      </form>

      <div class="link-row" style="margin-top:14px;">
        <button id="logout" class="btn-link" type="button">Sign out</button>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth-guard.js"></script>
  <script>
    window.addEventListener('authready', (ev) => {
      const user = ev.detail;
      if (user.must_change_password) {
        document.getElementById('hint').textContent =
          'Your account uses a temporary password. Please set a new one to continue.';
      }
    });

    document.getElementById('logout').addEventListener('click', async () => {
      await api('/api/auth/logout', { method: 'POST' });
      window.location.replace('/login.html');
    });

    const form = document.getElementById('form');
    const msg = document.getElementById('msg');
    const submit = document.getElementById('submit');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.style.display = 'none';
      const oldPassword = document.getElementById('oldPassword').value;
      const newPassword = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirm').value;

      if (newPassword.length < 8) { showErr(msg, 'New password must be at least 8 characters.'); return; }
      if (newPassword !== confirm) { showErr(msg, 'Passwords do not match.'); return; }

      submit.disabled = true;
      submit.textContent = 'Updating…';
      const r = await api('/api/auth/change-password', {
        method: 'POST',
        body: { oldPassword, newPassword },
      });
      submit.disabled = false;
      submit.textContent = 'Update password';

      if (!r.ok) { showErr(msg, (r.data && r.data.error) || 'Update failed.'); return; }

      showOk(msg, 'Password updated. Redirecting…');
      setTimeout(() => window.location.replace('/dashboard.html'), 900);
    });
  </script>
</body>
</html>
